[database]
path = "data/db/spontaneous_apply.sqlite"

[paths]
companies_seed_csv = "data/input/companies_seed.csv"
company_profiles_jsonl = "data/processed/company_profiles.jsonl"
email_drafts_jsonl = "data/processed/email_drafts.jsonl"
wttj_raw_dir = "data/raw/wttj_pages"
log_file = "data/logs/pipeline.log"

[llm]
model = "gpt-4o"
temperature = 0.2

[wttj_company_search]
max_pages = 11
request_timeout_seconds = 30
delay_seconds = 0.5
hits_per_page = 30
render_with_browser = true
url_template = "https://www.welcometothejungle.com/fr/companies?page={page}&aroundQuery=France&query=&refinementList%5Bsectors_name.fr.Tech%5D%5B0%5D=Intelligence%20artificielle%20%2F%20Machine%20Learning&refinementList%5Boffices.country_code%5D%5B0%5D=FR"
