[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candipilot"
version = "0.1.0"
description = "AI-assisted job application copilot with semantic ranking, anti-hallucination CV adaptation, contact discovery and Gmail drafts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lachtar Nour"}]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "openai>=1.40",
    "tiktoken>=0.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "rapidfuzz>=3.6",
    "unidecode>=1.3",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "pandas>=2.2", "altair>=5.2"]
pdf = ["weasyprint>=61.0"]
gmail = [
    "google-api-python-client>=2.125",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
local-embeddings = ["sentence-transformers>=2.7"]
wttj = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
candipilot = "smartapply.cli:cli"
smartapply = "smartapply.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartapply*"]

[tool.setuptools.package-data]
smartapply = ["cv/templates/*.j2", "llm/prompts/templates/*/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: integration tests that may use network or local files",
    "llm: tests that require LLM provider (skipped without OPENAI_API_KEY)",
    "real_pdf: opt out of the html_to_pdf stub fixture (runs a real renderer)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
